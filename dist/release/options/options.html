<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pilgrim Form Helper</title>
<link rel="stylesheet" href="../lib/ui.css"><link rel="stylesheet" href="options.css"></head>
<body>
<header class="temple-bar top">
  <span id="logo" class="logo"></span>
  <div class="brand"><b>Pilgrim Form Helper</b><span lang="te">ఓం నమో వేంకటేశాయ · Om Namo Venkatesaya</span></div>
  <span class="spacer"></span>
  <span class="saved" id="saved" aria-live="polite"></span>
  <button type="button" class="ibtn" id="theme" title="Day / night" aria-label="Toggle day or night theme"></button>
</header>
<div class="toranam" aria-hidden="true"></div>
<div class="layout">
  <nav aria-label="Sections" id="nav"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="watermark" id="wm" aria-hidden="true"></div>
<dialog id="dlg"></dialog>
<script type="module" src="options.js"></script>
</body>
</html>
